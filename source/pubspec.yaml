name: internet_manager
description: Offline-first Internet Manager with professional Arabic UI and local data.
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  file_picker: ^12.0.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding_network.png
    - assets/onboarding_control.png
    - assets/onboarding_insights.png
    - assets/alidrisi_app_icon.png
  generate: true

flutter_launcher_icons:
  android: true
  image_path: assets/alidrisi_app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#071A3A'
  adaptive_icon_foreground: assets/alidrisi_app_icon.png
